name: Keep Render Awake

on:
  schedule:
    - cron: '*/13 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Render Endpoint
        run: |
          echo "Pinging Render to keep instance awake..."
          curl -f -sS --connect-timeout 30 --max-time 60 https://server.willbergforever.com/user/verify
